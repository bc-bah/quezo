name: Scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: postgres/uv.lock
      - run: npm ci
      - run: uv sync --directory postgres --locked --python 3.12
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck:e2e
      - name: Real browser, Keycloak, API and isolated PostgreSQL AT-01
        run: npm run test:e2e
      # No browser state, traces, HAR, screenshots or raw application logs are uploaded.

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: postgres/uv.lock
      - run: uv sync --directory postgres --locked --python 3.12
      - run: npm run api:check
      - run: npm run test:contracts
      - run: npm run test:web
      - run: npm run typecheck:web
      - run: npm run build
      - name: Validate local dependency configuration
        run: docker compose --profile identity config --quiet
        env:
          POSTGRES_PASSWORD: ci-config-validation-only
          KEYCLOAK_ADMIN_PASSWORD: ci-config-validation-only

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: postgres
    env:
      # Synthetic credentials for this job's disposable, loopback-only service.
      QUEZO_TEST_ADMIN_URL: postgresql://quezo_test_admin:ci-test-admin@127.0.0.1:5432/quezo_test_control
      QUEZO_TEST_MIGRATION_PASSWORD: ci-test-migrator
      QUEZO_TEST_RUNTIME_PASSWORD: ci-test-runtime
      QUEZO_TEST_WEB_PASSWORD: ci-test-web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quezo_test_control
          POSTGRES_USER: quezo_test_admin
          POSTGRES_PASSWORD: ci-test-admin
          QUEZO_MIGRATION_PASSWORD: ci-test-migrator
          QUEZO_RUNTIME_PASSWORD: ci-test-runtime
          QUEZO_WEB_PASSWORD: ci-test-web
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U quezo_test_admin -d quezo_test_control"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: postgres/uv.lock
      - run: uv python install "${{ matrix.python }}"
      - run: uv sync --locked --python "${{ matrix.python }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefix ..
      - name: Bootstrap isolated database identities and safety marker
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -U quezo_test_admin -d quezo_test_control < bootstrap/roles.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -U quezo_test_admin -d quezo_test_control < tests/bootstrap.sql
      - run: uv run --locked --python "${{ matrix.python }}" mypy
      - run: uv run --locked --python "${{ matrix.python }}" pytest
      - name: Actual isolated Keycloak provisioning and token integration
        if: matrix.python == '3.12'
        working-directory: .
        env:
          POSTGRES_PASSWORD: unused-config-placeholder
          KEYCLOAK_ADMIN: quezo-admin
          KEYCLOAK_TEST_PORT: "58080"
          KEYCLOAK_LOCAL_ORIGIN: http://localhost:58080
        run: |
          export KEYCLOAK_ADMIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export QUEZO_OIDC_CLIENT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export QUEZO_SYNTHETIC_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$KEYCLOAK_ADMIN_PASSWORD"
          echo "::add-mask::$QUEZO_OIDC_CLIENT_SECRET"
          echo "::add-mask::$QUEZO_SYNTHETIC_PASSWORD"
          docker compose -p quezo-i01-ci --profile identity-test up -d keycloak-test
          curl --retry 60 --retry-all-errors --retry-delay 2 --max-time 2 --fail --silent --output /dev/null http://localhost:58080/realms/master/.well-known/openid-configuration
          npm run test:identity:integration
      - name: Remove isolated Keycloak test service
        if: always() && matrix.python == '3.12'
        working-directory: .
        env:
          POSTGRES_PASSWORD: unused-config-placeholder
          KEYCLOAK_ADMIN_PASSWORD: unused-config-placeholder
        run: docker compose -p quezo-i01-ci --profile identity-test rm -s -f keycloak-test
      - run: npm run build --prefix ..
      - run: npm run test:web:production --prefix ..
