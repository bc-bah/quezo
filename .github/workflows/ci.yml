name: Scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: postgres/uv.lock
      - run: uv sync --directory postgres --locked --python 3.12
      - run: npm run api:check
      - run: npm run test:contracts
      - run: npm run test:web
      - run: npm run typecheck:web
      - run: npm run build
      - name: Validate local dependency configuration
        run: docker compose --profile identity config --quiet
        env:
          POSTGRES_PASSWORD: ci-config-validation-only
          KEYCLOAK_ADMIN_PASSWORD: ci-config-validation-only

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: postgres
    env:
      # Synthetic credentials for this job's disposable, loopback-only service.
      QUEZO_TEST_ADMIN_URL: postgresql://quezo_test_admin:ci-test-admin@127.0.0.1:5432/quezo_test_control
      QUEZO_TEST_MIGRATION_PASSWORD: ci-test-migrator
      QUEZO_TEST_RUNTIME_PASSWORD: ci-test-runtime
      QUEZO_TEST_WEB_PASSWORD: ci-test-web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quezo_test_control
          POSTGRES_USER: quezo_test_admin
          POSTGRES_PASSWORD: ci-test-admin
          QUEZO_MIGRATION_PASSWORD: ci-test-migrator
          QUEZO_RUNTIME_PASSWORD: ci-test-runtime
          QUEZO_WEB_PASSWORD: ci-test-web
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U quezo_test_admin -d quezo_test_control"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: postgres/uv.lock
      - run: uv python install "${{ matrix.python }}"
      - run: uv sync --locked --python "${{ matrix.python }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefix ..
      - name: Bootstrap isolated database identities and safety marker
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -U quezo_test_admin -d quezo_test_control < bootstrap/roles.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -U quezo_test_admin -d quezo_test_control < tests/bootstrap.sql
      - run: uv run --locked --python "${{ matrix.python }}" mypy
      - run: uv run --locked --python "${{ matrix.python }}" pytest
      - run: npm run build --prefix ..
      - run: npm run test:web:production --prefix ..
